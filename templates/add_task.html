{% extends "base.html" %}

{% block title %}
Add Task
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Add New Task
                </h2>


                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Task Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            placeholder="Enter your task"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Task
                        </button>

                        <a
                            href="{{ url_for('home') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
